[project]
name = "fastapi-htmx"
version = "0.1.0"
description = "Study project for `FASTAPI + HTMX: The no-build full-stack`"
authors = [
    { name = "Houssame Yahiaoui", email = "houssame.yahiaoui@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-htmx = "fastapi_htmx:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "fastapi_htmx.main:app"